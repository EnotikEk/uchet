<!-- Модальное окно добавления оборудования -->
<div class="modal fade" id="addEquipmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-desktop"></i> Добавить оборудование</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addEquipmentForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Тип <span class="text-danger">*</span></label>
                            <select class="form-select" id="addType" onchange="updateEquipmentTypeForm()" required>
                                <optgroup label="Компьютеры">
                                    <option value="Компьютер">Компьютер</option>
                                    <option value="Ноутбук">Ноутбук</option>
                                    <option value="Моноблок">Моноблок</option>
                                    <option value="Сервер">Сервер</option>
                                    <option value="Планшет">Планшет</option>
                                </optgroup>
                                <optgroup label="Мониторы">
                                    <option value="Монитор">Монитор</option>
                                </optgroup>
                                <optgroup label="МФУ и оргтехника">
                                    <option value="МФУ">МФУ</option>
                                    <option value="Принтер">Принтер</option>
                                    <option value="Сканер">Сканер</option>
                                </optgroup>
                                <optgroup label="Периферия">
                                    <option value="Сетевое оборудование">Сетевое оборудование</option>
                                    <option value="ИБП">ИБП</option>
                                    <option value="Мышь/Клавиатура">Мышь/Клавиатура</option>
                                    <option value="Внешний диск">Внешний диск</option>
                                    <option value="Веб-камера/Гарнитура/Микрофон">Веб-камера/Гарнитура/Микрофон</option>
                                    <option value="Колонки">Колонки</option>
                                    <option value="Другое">Другое</option>
                                </optgroup>
                                <optgroup label="Комплектующие и расходники">
                                    <option value="Процессор">Процессор</option>
                                    <option value="Оперативная память">Оперативная память</option>
                                    <option value="Накопитель">Накопитель</option>
                                    <option value="Материнская плата">Материнская плата</option>
                                    <option value="Видеокарта">Видеокарта</option>
                                    <option value="Аккумулятор">Аккумулятор</option>
                                    <option value="Контроллер">Контроллер</option>
                                    <option value="Привод">Привод</option>
                                    <option value="Звуковая карта">Звуковая карта</option>
                                    <option value="Блок питания">Блок питания</option>
                                    <option value="PCI-устройство">PCI-устройство</option>
                                    <option value="Сетевая карта">Сетевая карта</option>
                                    <option value="Кабель">Кабель</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Бренд</label>
                            <input class="form-control" id="addBrand" placeholder="HP, Dell, Lenovo...">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Модель</label>
                            <input class="form-control" id="addModel" placeholder="Модель">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Серийный номер</label>
                            <input class="form-control" id="addSerial">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Инвентарный номер</label>
                            <input class="form-control" id="addInventory">
                        </div>
                    </div>

                    <div class="row" id="addParentGroup" style="display:none;">
                        <div class="col-md-12 mb-3">
                            <label class="form-label"><i class="fas fa-desktop"></i> Установлено на компьютере</label>
                            <select class="form-select" id="addParent">
                                <option value="">— на складе / не установлено —</option>
                                {% for c in computers %}
                                <option value="{{ c.id }}">{{ c.label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- ===== Характеристики по типу: поля строятся из static/js/equipment-specs.js ===== -->
                    <div id="addTypeSpecificBlock" style="display:none;">
                        <hr><h6 class="text-muted" id="addTypeSpecificTitle">Характеристики</h6>
                        <div id="addTypeSpecific"></div>
                    </div>

                    <hr>
                    <div class="row">
                        {% set eq_col = 'col-md-3' if current_addresses else 'col-md-4' %}
                        <div class="{{ eq_col }} mb-3"><label class="form-label">МОЛ</label>
                            <select class="combo-create form-select" id="addMol" data-placeholder="Введите ФИО"><option value=""></option>{% for emp in employees %}<option value="{{ emp }}">{{ emp }}</option>{% endfor %}</select>
                        </div>
                        <div class="{{ eq_col }} mb-3"><label class="form-label">Ответственный (пользователь)</label>
                            <select class="combo-create form-select" id="addResponsible" data-placeholder="Введите ФИО"><option value=""></option>{% for emp in employees %}<option value="{{ emp }}">{{ emp }}</option>{% endfor %}</select>
                        </div>
                        {% if current_addresses %}
                        <div class="{{ eq_col }} mb-3"><label class="form-label"><i class="fas fa-map-marker-alt"></i> Адрес</label>
                            <select class="form-select" id="addAddress">
                                <option value="">— не указан —</option>
                                {% for addr in current_addresses %}
                                <option value="{{ addr.id }}" {% if current_address_id == addr.id %}selected{% endif %}>{{ addr.address }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}
                        <div class="{{ eq_col }} mb-3"><label class="form-label">Помещение (кабинет)</label>
                            <select class="combo-create form-select" id="addRoom" data-placeholder="Кабинет, склад, гараж..."><option value=""></option>{% for room in rooms %}<option value="{{ room.number }}">{{ room.number }}</option>{% endfor %}</select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3"><label class="form-label">Статус</label>
                            <select class="form-select" id="addStatus">
                                {% for st in statuses %}
                                <option value="{{ st }}" {{ 'selected' if st == 'Установлено' else '' }}>{{ st }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3"><label class="form-label">Дата принятия к учёту</label><input type="date" class="form-control" id="addPurchaseDate"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Гарантия до</label><input type="date" class="form-control" id="addWarranty"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Цена</label><input type="number" step="0.01" class="form-control" id="addPrice"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Поставщик</label><input class="form-control" id="addSupplier"></div>
                    <div class="mb-3"><label class="form-label">Характеристики</label><textarea class="form-control" id="addCharacteristics" rows="2" placeholder="Дополнительные характеристики"></textarea></div>
                    <div class="mb-3"><label class="form-label">Примечание</label><textarea class="form-control" id="addNotes" rows="2"></textarea></div>
                    <div class="alert alert-secondary small mb-0"><i class="fas fa-info-circle"></i> Фото можно прикрепить после сохранения записи — откройте её карточку.</div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveNewEquipment()"><i class="fas fa-save"></i> Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
// Для этих типов "установлено на компьютере" не имеет смысла (это сам компьютер или МФУ)
const NO_PARENT_TYPES = ['Компьютер', 'Ноутбук', 'Моноблок', 'Сервер', 'Планшет', 'МФУ', 'Принтер'];

function updateEquipmentTypeForm() {
    const type = $('#addType').val();
    const hasFields = renderSpecForm(document.getElementById('addTypeSpecific'), type, null);
    $('#addTypeSpecificTitle').text('Характеристики: ' + (type || ''));
    $('#addTypeSpecificBlock').toggle(hasFields);
    $('#addParentGroup').toggle(!NO_PARENT_TYPES.includes(type));
}

// Этот скрипт выполняется до подключения jQuery (он в конце base.html),
// поэтому обработчики вешаем, когда документ загружен целиком.
document.addEventListener('DOMContentLoaded', function() {
    updateEquipmentTypeForm();
    $('#addEquipmentModal').on('show.bs.modal', function() {
        $('#addEquipmentForm')[0].reset();
        // reset() не очищает поля Tom Select — очищаем их отдельно
        document.querySelectorAll('#addEquipmentForm select.combo-create').forEach(function(el) {
            if (el.tomselect) el.tomselect.clear(true);
        });
        updateEquipmentTypeForm();
    });
});

function saveNewEquipment() {
    const type = $('#addType').val();
    if (!type) { showMessage('Выберите тип', 'danger'); return; }

    const data = {
        type: type,
        brand: $('#addBrand').val(),
        model: $('#addModel').val(),
        serial_number: $('#addSerial').val(),
        inventory_number: $('#addInventory').val(),
        mol: $('#addMol').val(),
        responsible: $('#addResponsible').val(),
        room: $('#addRoom').val(),
        ...($('#addAddress').length ? { address_id: $('#addAddress').val() || null } : {}),
        status: $('#addStatus').val(),
        purchase_date: $('#addPurchaseDate').val(),
        warranty_until: $('#addWarranty').val(),
        price: $('#addPrice').val() || null,
        supplier: $('#addSupplier').val(),
        characteristics: $('#addCharacteristics').val(),
        notes: $('#addNotes').val(),
        parent_equipment_id: NO_PARENT_TYPES.includes(type) ? null : ($('#addParent').val() || null)
    };
    const spec = collectSpecForm(document.getElementById('addTypeSpecific'), type);
    Object.assign(data, spec.columns);
    data.specs = spec.specs;

    $.ajax({
        url: '/api/equipment',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(resp) {
            if (resp.success) {
                showMessage('Добавлено', 'success');
                $('#addEquipmentModal').modal('hide');
                loadEquipment();
            } else {
                showMessage(resp.error || 'Ошибка добавления', 'danger');
            }
        },
        error: function(xhr) { showMessage((xhr.responseJSON && xhr.responseJSON.error) || 'Ошибка добавления', 'danger'); }
    });
}
</script>
