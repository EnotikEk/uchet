<!-- Модальное окно добавления оборудования -->
<div class="modal fade" id="addEquipmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-desktop"></i> Добавить оборудование</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <datalist id="addRoomList">{% for room in rooms %}<option value="{{ room.number }}">{% endfor %}</datalist>
                <datalist id="addMolList">{% for emp in employees %}<option value="{{ emp }}">{% endfor %}</datalist>
                <form id="addEquipmentForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Тип <span class="text-danger">*</span></label>
                            <select class="form-select" id="addType" onchange="updateEquipmentTypeForm()" required>
                                <optgroup label="Компьютеры">
                                    <option value="Компьютер">Компьютер</option>
                                    <option value="Ноутбук">Ноутбук</option>
                                    <option value="Моноблок">Моноблок</option>
                                    <option value="Сервер">Сервер</option>
                                    <option value="Планшет">Планшет</option>
                                </optgroup>
                                <optgroup label="Мониторы">
                                    <option value="Монитор">Монитор</option>
                                </optgroup>
                                <optgroup label="МФУ и оргтехника">
                                    <option value="МФУ">МФУ</option>
                                    <option value="Принтер">Принтер</option>
                                    <option value="Сканер">Сканер</option>
                                </optgroup>
                                <optgroup label="Периферия">
                                    <option value="Сетевое оборудование">Сетевое оборудование</option>
                                    <option value="ИБП">ИБП</option>
                                    <option value="Мышь/Клавиатура">Мышь/Клавиатура</option>
                                    <option value="Внешний диск">Внешний диск</option>
                                    <option value="Веб-камера/Гарнитура/Микрофон">Веб-камера/Гарнитура/Микрофон</option>
                                    <option value="Колонки">Колонки</option>
                                    <option value="Другое">Другое</option>
                                </optgroup>
                                <optgroup label="Комплектующие и расходники">
                                    <option value="Процессор">Процессор</option>
                                    <option value="Оперативная память">Оперативная память</option>
                                    <option value="Накопитель">Накопитель</option>
                                    <option value="Материнская плата">Материнская плата</option>
                                    <option value="Видеокарта">Видеокарта</option>
                                    <option value="Аккумулятор">Аккумулятор</option>
                                    <option value="Контроллер">Контроллер</option>
                                    <option value="Привод">Привод</option>
                                    <option value="Звуковая карта">Звуковая карта</option>
                                    <option value="Блок питания">Блок питания</option>
                                    <option value="PCI-устройство">PCI-устройство</option>
                                    <option value="Сетевая карта">Сетевая карта</option>
                                    <option value="Кабель">Кабель</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Бренд</label>
                            <input class="form-control" id="addBrand" placeholder="HP, Dell, Lenovo...">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Модель</label>
                            <input class="form-control" id="addModel" placeholder="Модель">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Серийный номер</label>
                            <input class="form-control" id="addSerial">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Инвентарный номер</label>
                            <input class="form-control" id="addInventory">
                        </div>
                    </div>

                    <div class="row" id="addParentGroup" style="display:none;">
                        <div class="col-md-12 mb-3">
                            <label class="form-label"><i class="fas fa-desktop"></i> Установлено на компьютере</label>
                            <select class="form-select" id="addParent">
                                <option value="">— на складе / не установлено —</option>
                                {% for c in computers %}
                                <option value="{{ c.id }}">{{ c.label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- ===== Компьютеры ===== -->
                    <div class="type-form" id="formComputer" style="display:none;">
                        <hr><h6 class="text-muted">Параметры компьютера</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Сетевое имя</label><input class="form-control" id="addNetworkName" placeholder="PC-001"></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Год производства</label><input type="number" class="form-control" id="addManufactureYear" min="1990" max="2100"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Процессор</label><input class="form-control" id="addProcessor"></div>
                            <div class="col-md-2 mb-3"><label class="form-label">ОЗУ (ГБ)</label><input type="number" class="form-control" id="addRam"></div>
                            <div class="col-md-2 mb-3"><label class="form-label">Тип ОЗУ</label>
                                <select class="form-select" id="addRamType"><option value=""></option><option>DDR2</option><option>DDR3</option><option>DDR4</option><option>DDR5</option></select>
                            </div>
                            <div class="col-md-4 mb-3"><label class="form-label">Накопитель</label><input class="form-control" id="addStorage" placeholder="SSD 512GB"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">ОС</label><input class="form-control" id="addOs"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Ключ ОС</label><input class="form-control" id="addOsKey"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">IP-адрес</label><input class="form-control" id="addIpAddress1"></div>
                        </div>
                    </div>

                    <!-- ===== Мониторы ===== -->
                    <div class="type-form" id="formMonitor" style="display:none;">
                        <hr><h6 class="text-muted">Параметры монитора</h6>
                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label">Диагональ (")</label><input type="number" class="form-control" id="addMonitorSize"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Разрешение</label>
                                <select class="form-select" id="addResolution"><option value=""></option><option>1920x1080</option><option>2560x1440</option><option>3840x2160</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">Частота, Гц</label><input type="number" class="form-control" id="addRefreshRate"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Тип матрицы</label>
                                <select class="form-select" id="addPanelType"><option value=""></option><option>IPS</option><option>VA</option><option>TN</option><option>OLED</option></select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Время отклика, мс</label><input type="number" class="form-control" id="addResponseTime"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Угол обзора</label><input class="form-control" id="addViewingAngle"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Тип подключения</label><input class="form-control" id="addConnectionTypeMonitor" placeholder="HDMI, DP, VGA..."></div>
                        </div>
                    </div>

                    <!-- ===== Сетевое оборудование ===== -->
                    <div class="type-form" id="formNetwork" style="display:none;">
                        <hr><h6 class="text-muted">Параметры сетевого оборудования</h6>
                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label">Кол-во портов</label><input type="number" class="form-control" id="addPortCount"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Скорость портов</label>
                                <select class="form-select" id="addSpeedNetwork"><option value=""></option><option>100Mbps</option><option>1Gbps</option><option>10Gbps</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">PoE</label>
                                <select class="form-select" id="addPoe"><option value=""></option><option>Нет</option><option>Да</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">Управляемый</label>
                                <select class="form-select" id="addManaged"><option value=""></option><option>Нет</option><option>Да</option></select>
                            </div>
                        </div>
                        <div class="row"><div class="col-md-6 mb-3"><label class="form-label">IP-адрес</label><input class="form-control" id="addIpAddress2"></div></div>
                    </div>

                    <!-- ===== МФУ / Принтер / Сканер ===== -->
                    <div class="type-form" id="formPrint" style="display:none;">
                        <hr><h6 class="text-muted">Параметры печати/сканирования</h6>
                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label">Тип печати</label>
                                <select class="form-select" id="addPrintType"><option value=""></option><option>Лазерный</option><option>Струйный</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">Формат</label>
                                <select class="form-select" id="addPrintFormat"><option value=""></option><option>A4</option><option>A3</option><option>A3-A4</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">Скорость печати</label><input type="number" class="form-control" id="addPrintSpeed"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Цветность</label>
                                <select class="form-select" id="addColorType"><option value=""></option><option>Ч/Б</option><option>Цветной</option></select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label">Двусторонняя печать</label>
                                <select class="form-select" id="addDuplex"><option value="Нет">Нет</option><option value="Да">Да</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">IP-адрес</label><input class="form-control" id="addIpAddress3"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Разрешение сканера</label><input class="form-control" id="addScannerResolution"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Скорость сканера</label><input class="form-control" id="addScannerSpeed"></div>
                        </div>
                    </div>

                    <!-- ===== ИБП ===== -->
                    <div class="type-form" id="formUps" style="display:none;">
                        <hr><h6 class="text-muted">Параметры ИБП</h6>
                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label">Мощность (VA)</label><input class="form-control" id="addUpsPower"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Тип</label>
                                <select class="form-select" id="addUpsType"><option value=""></option><option>Резервный</option><option>Линейно-интерактивный</option><option>On-line</option></select>
                            </div>
                            <div class="col-md-3 mb-3"><label class="form-label">Розеток</label><input type="number" class="form-control" id="addUpsOutlets"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Время работы, мин</label><input type="number" class="form-control" id="addUpsRuntime"></div>
                        </div>
                    </div>

                    <!-- ===== Простая периферия (мышь/клавиатура, камера/гарнитура, колонки, внешний диск, док-станция, другое) ===== -->
                    <div class="type-form" id="formConnection" style="display:none;">
                        <hr><h6 class="text-muted">Параметры</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Тип подключения</label><input class="form-control" id="addConnectionType" placeholder="USB, Bluetooth, Wireless..."></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Цвет</label><input class="form-control" id="addColor"></div>
                            <div class="col-md-4 mb-3" id="addStorageSizeGroup" style="display:none;"><label class="form-label">Объём</label><input class="form-control" id="addStorageSize" placeholder="1TB"></div>
                        </div>
                    </div>

                    <!-- ===== Комплектующие и расходники ===== -->
                    <div class="type-form" id="formComponent" style="display:none;">
                        <hr><h6 class="text-muted">Параметры комплектующего</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Объём (ГБ) <small class="text-muted">ОЗУ/видеопамять</small></label><input type="number" class="form-control" id="addComponentRam"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Тип ОЗУ</label>
                                <select class="form-select" id="addComponentRamType"><option value=""></option><option>DDR2</option><option>DDR3</option><option>DDR4</option><option>DDR5</option></select>
                            </div>
                            <div class="col-md-4 mb-3"><label class="form-label">Накопитель/ёмкость</label><input class="form-control" id="addComponentStorage" placeholder="512GB, 5000mAh, 650W..."></div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label">Порты</label><input class="form-control" id="addComponentPorts"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Скорость/сеть</label><input class="form-control" id="addComponentSpeed"></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Тип подключения</label><input class="form-control" id="addComponentConnection"></div>
                            <div class="col-md-3 mb-3" id="addCableTypeGroup" style="display:none;">
                                <label class="form-label">Тип разъёма (кабель)</label>
                                <select class="form-select" id="addCableType">
                                    <option value=""></option>
                                    <option>DVI</option><option>HDMI</option><option>RJ45</option><option>USB-C</option>
                                    <option>VGA</option><option>DisplayPort</option><option>Jack 3.5mm</option><option>Питание</option><option>Другое</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label class="form-label">МОЛ</label><input class="form-control" id="addMol" list="addMolList"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Ответственный</label><input class="form-control" id="addResponsible" list="addMolList"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Помещение</label><input class="form-control" id="addRoom" list="addRoomList" placeholder="Кабинет, склад, гараж..."></div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3"><label class="form-label">Статус</label>
                            <select class="form-select" id="addStatus">
                                {% for st in statuses %}
                                <option value="{{ st }}" {{ 'selected' if st == 'Установлено' else '' }}>{{ st }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3"><label class="form-label">Дата принятия к учёту</label><input type="date" class="form-control" id="addPurchaseDate"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Гарантия до</label><input type="date" class="form-control" id="addWarranty"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Цена</label><input type="number" step="0.01" class="form-control" id="addPrice"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Поставщик</label><input class="form-control" id="addSupplier"></div>
                    <div class="mb-3"><label class="form-label">Характеристики</label><textarea class="form-control" id="addCharacteristics" rows="2" placeholder="Дополнительные характеристики"></textarea></div>
                    <div class="mb-3"><label class="form-label">Примечание</label><textarea class="form-control" id="addNotes" rows="2"></textarea></div>
                    <div class="alert alert-secondary small mb-0"><i class="fas fa-info-circle"></i> Фото можно прикрепить после сохранения записи — откройте её карточку.</div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveNewEquipment()"><i class="fas fa-save"></i> Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
// Типы Equipment.type -> какие блоки .type-form показывать
const TYPE_FORM_MAP = {
    'Компьютер': ['formComputer'], 'Ноутбук': ['formComputer'], 'Моноблок': ['formComputer', 'formMonitor'],
    'Сервер': ['formComputer'], 'Планшет': ['formComputer'],
    'Монитор': ['formMonitor'],
    'Сетевое оборудование': ['formNetwork'],
    'МФУ': ['formPrint'], 'Принтер': ['formPrint'], 'Сканер': ['formPrint'],
    'ИБП': ['formUps'],
    'Мышь/Клавиатура': ['formConnection'], 'Веб-камера/Гарнитура/Микрофон': ['formConnection'],
    'Колонки': ['formConnection'], 'Внешний диск': ['formConnection'], 'Док-станция': ['formConnection'],
    'Другое': ['formConnection'],
    'Процессор': ['formComponent'], 'Оперативная память': ['formComponent'], 'Накопитель': ['formComponent'],
    'Материнская плата': ['formComponent'], 'Видеокарта': ['formComponent'], 'Аккумулятор': ['formComponent'],
    'Контроллер': ['formComponent'], 'Привод': ['formComponent'], 'Звуковая карта': ['formComponent'],
    'Блок питания': ['formComponent'], 'PCI-устройство': ['formComponent'], 'Сетевая карта': ['formComponent'],
    'Кабель': ['formComponent']
};
// Для этих типов "установлено на компьютере" не имеет смысла (это сам компьютер или МФУ)
const NO_PARENT_TYPES = ['Компьютер', 'Ноутбук', 'Моноблок', 'Сервер', 'Планшет', 'МФУ', 'Принтер'];

function updateEquipmentTypeForm() {
    const type = $('#addType').val();
    $('.type-form').hide();
    (TYPE_FORM_MAP[type] || []).forEach(id => $('#' + id).show());
    $('#addStorageSizeGroup').toggle(type === 'Внешний диск');
    $('#addCableTypeGroup').toggle(type === 'Кабель');
    $('#addParentGroup').toggle(!NO_PARENT_TYPES.includes(type));
}

$(document).ready(function() {
    updateEquipmentTypeForm();
    $('#addEquipmentModal').on('show.bs.modal', function() {
        $('#addEquipmentForm')[0].reset();
        updateEquipmentTypeForm();
    });
});

function saveNewEquipment() {
    const type = $('#addType').val();
    if (!type) { showMessage('Выберите тип', 'danger'); return; }

    const data = {
        type: type,
        brand: $('#addBrand').val(),
        model: $('#addModel').val(),
        serial_number: $('#addSerial').val(),
        inventory_number: $('#addInventory').val(),
        mol: $('#addMol').val(),
        responsible: $('#addResponsible').val(),
        room: $('#addRoom').val(),
        status: $('#addStatus').val(),
        purchase_date: $('#addPurchaseDate').val(),
        warranty_until: $('#addWarranty').val(),
        price: $('#addPrice').val() || null,
        supplier: $('#addSupplier').val(),
        characteristics: $('#addCharacteristics').val(),
        notes: $('#addNotes').val(),
        network_name: $('#addNetworkName').val(),
        manufacture_year: $('#addManufactureYear').val() || null,
        parent_equipment_id: NO_PARENT_TYPES.includes(type) ? null : ($('#addParent').val() || null),
        processor: $('#addProcessor').val(),
        ram: $('#addRam').val() || $('#addComponentRam').val() || null,
        ram_type: $('#addRamType').val() || $('#addComponentRamType').val(),
        storage: $('#addStorage').val() || $('#addComponentStorage').val(),
        os: $('#addOs').val(),
        os_key: $('#addOsKey').val(),
        monitor_size: $('#addMonitorSize').val() || null,
        resolution: $('#addResolution').val(),
        refresh_rate: $('#addRefreshRate').val() || null,
        panel_type: $('#addPanelType').val(),
        response_time: $('#addResponseTime').val() || null,
        viewing_angle: $('#addViewingAngle').val(),
        port_count: $('#addPortCount').val() || null,
        ports: $('#addComponentPorts').val(),
        speed: $('#addSpeedNetwork').val() || $('#addComponentSpeed').val(),
        poe: $('#addPoe').val(),
        managed: $('#addManaged').val(),
        ip_address: $('#addIpAddress1').val() || $('#addIpAddress2').val() || $('#addIpAddress3').val(),
        print_type: $('#addPrintType').val(),
        print_format: $('#addPrintFormat').val(),
        print_speed: $('#addPrintSpeed').val() || null,
        color_type: $('#addColorType').val(),
        duplex: $('#addDuplex').val(),
        scanner_resolution: $('#addScannerResolution').val(),
        scanner_speed: $('#addScannerSpeed').val(),
        ups_power: $('#addUpsPower').val(),
        ups_type: $('#addUpsType').val(),
        ups_outlets: $('#addUpsOutlets').val() || null,
        ups_runtime: $('#addUpsRuntime').val() || null,
        connection_type: $('#addConnectionType').val() || $('#addConnectionTypeMonitor').val() || $('#addComponentConnection').val(),
        color: $('#addColor').val(),
        cable_type: $('#addCableType').val()
    };
    if (type === 'Внешний диск' && $('#addStorageSize').val()) {
        data.storage = $('#addStorageSize').val();
    }

    $.ajax({
        url: '/api/equipment',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(resp) {
            if (resp.success) {
                showMessage('Добавлено', 'success');
                $('#addEquipmentModal').modal('hide');
                loadEquipment();
            } else {
                showMessage(resp.error || 'Ошибка добавления', 'danger');
            }
        },
        error: function(xhr) { showMessage((xhr.responseJSON && xhr.responseJSON.error) || 'Ошибка добавления', 'danger'); }
    });
}
</script>
