<!-- Обновленная форма добавления оборудования с динамическими полями -->
<div class="modal fade" id="addEquipmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-plus"></i> Добавить оборудование</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addEquipmentForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Тип <span class="text-danger">*</span></label>
                            <select class="form-select" id="addEquipmentType" required>
                                <option value="">Выберите</option>
                                <option value="Компьютер">💻 Компьютер</option>
                                <option value="Ноутбук">💻 Ноутбук</option>
                                <option value="Монитор">🖥️ Монитор</option>
                                <option value="Сервер">🗄️ Сервер</option>
                                <option value="Сетевое оборудование">🌐 Сетевое оборудование</option>
                                <option value="Принтер">🖨️ Принтер</option>
                                <option value="МФУ">🖨️ МФУ</option>
                                <option value="Сканер">📠 Сканер</option>
                                <option value="IP-телефон">📞 IP-телефон</option>
                                <option value="Мышь">🖱️ Мышь</option>
                                <option value="Клавиатура">⌨️ Клавиатура</option>
                                <option value="ИБП">🔋 ИБП</option>
                                <option value="Внешний диск">💾 Внешний диск</option>
                                <option value="Док-станция">🔌 Док-станция</option>
                                <option value="Веб-камера">📷 Веб-камера</option>
                                <option value="Гарнитура">🎧 Гарнитура</option>
                                <option value="Колонки">🔊 Колонки</option>
                                <option value="Другое">📦 Другое</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Бренд</label>
                            <input type="text" class="form-control" id="addEquipmentBrand" placeholder="HP, Dell">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Модель</label>
                            <input type="text" class="form-control" id="addEquipmentModel" placeholder="Модель">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Серийный номер</label>
                            <input type="text" class="form-control" id="addEquipmentSerial" placeholder="S/N">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Инвентарный номер <span class="text-danger">* (уникальный)</span></label>
                            <input type="text" class="form-control" id="addEquipmentInventory" placeholder="Уникальный номер" required>
                            <small class="text-muted">Должен быть уникальным</small>
                        </div>
                    </div>
                    
                    <!-- Эксплуатирующий вместо ответственного -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Эксплуатирующий</label>
                            <select class="form-select" id="addEquipmentMOL">
                                <option value="">Выберите</option>
                                {% for emp in employees %}
                                <option value="{{ emp }}">{{ emp }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Кабинет</label>
                            <select class="form-select" id="addEquipmentRoom">
                                <option value="">Выберите</option>
                                {% for room in rooms %}
                                <option value="{{ room.number }}">{{ room.number }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Филиал</label>
                            <select class="form-select" id="addEquipmentOrganization">
                                <option value="">Выберите</option>
                                {% for org in organizations %}
                                <option value="{{ org.id }}">{{ org.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Статус</label>
                            <select class="form-select" id="addEquipmentStatus">
                                <option value="В работе">В работе</option>
                                <option value="Ремонт">Ремонт</option>
                                <option value="На складе">На складе</option>
                                <option value="Списано">Списано</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Дата принятия к учету</label>
                            <input type="date" class="form-control" id="addEquipmentPurchaseDate">
                        </div>
                    </div>
                    
                    <!-- Динамические поля для характеристик -->
                    <div id="addDynamicFields">
                        <div class="spec-fields system-fields" style="display:none;">
                            <hr>
                            <h6><i class="fas fa-microchip"></i> Системные характеристики</h6>
                            <div class="row">
                                <div class="col-md-4 mb-2"><input type="text" class="form-control" id="addEquipmentProcessor" placeholder="Процессор"></div>
                                <div class="col-md-2 mb-2"><input type="number" class="form-control" id="addEquipmentRam" placeholder="ОЗУ (ГБ)"></div>
                                <div class="col-md-3 mb-2"><input type="text" class="form-control" id="addEquipmentStorage" placeholder="Диск"></div>
                                <div class="col-md-3 mb-2"><input type="text" class="form-control" id="addEquipmentOs" placeholder="ОС"></div>
                                <div class="col-md-12 mt-2"><input type="text" class="form-control" id="addEquipmentOsKey" placeholder="Ключ ОС"></div>
                            </div>
                        </div>
                        
                        <div class="spec-fields monitor-fields" style="display:none;">
                            <hr>
                            <h6><i class="fas fa-tv"></i> Параметры дисплея</h6>
                            <div class="row">
                                <div class="col-md-6"><input type="number" class="form-control" id="addEquipmentMonitorSize" placeholder="Диагональ (дюймы)"></div>
                                <div class="col-md-6"><input type="text" class="form-control" id="addEquipmentResolution" placeholder="Разрешение"></div>
                            </div>
                        </div>
                        
                        <div class="spec-fields network-fields" style="display:none;">
                            <hr>
                            <h6><i class="fas fa-network-wired"></i> Сетевые параметры</h6>
                            <div class="row">
                                <div class="col-md-6"><input type="number" class="form-control" id="addEquipmentPortCount" placeholder="Количество портов"></div>
                                <div class="col-md-6"><input type="text" class="form-control" id="addEquipmentSpeed" placeholder="Скорость"></div>
                            </div>
                        </div>
                        
                        <div class="spec-fields peripheral-fields" style="display:none;">
                            <hr>
                            <h6><i class="fas fa-plug"></i> Периферийное устройство</h6>
                            <div class="alert alert-info small">Для периферийных устройств дополнительные характеристики не требуются</div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Примечание</label>
                        <textarea class="form-control" id="addEquipmentNotes" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveEquipment()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
// Управление динамическими полями
function updateDynamicFields(type) {
    // Скрываем все группы полей
    $('.spec-fields').hide();
    
    if (!type) return;
    
    // Показываем нужные поля в зависимости от типа
    const systemTypes = ['Компьютер', 'Ноутбук', 'Сервер'];
    const monitorTypes = ['Монитор'];
    const networkTypes = ['Сетевое оборудование', 'IP-телефон'];
    const peripheralTypes = ['Мышь', 'Клавиатура', 'ИБП', 'Внешний диск', 'Док-станция', 'Веб-камера', 'Гарнитура', 'Колонки'];
    
    if (systemTypes.includes(type) || type === 'Другое') {
        $('.system-fields').show();
    }
    if (monitorTypes.includes(type) || type === 'Другое') {
        $('.monitor-fields').show();
    }
    if (networkTypes.includes(type) || type === 'Другое') {
        $('.network-fields').show();
    }
    if (peripheralTypes.includes(type)) {
        $('.peripheral-fields').show();
    }
}

$(document).ready(function() {
    $('#addEquipmentType').on('change', function() {
        updateDynamicFields($(this).val());
    });
    
    $('#editEquipmentType').on('change', function() {
        updateDynamicFieldsEdit($(this).val());
    });
});

function updateDynamicFieldsEdit(type) {
    $('.spec-fields-edit').hide();
    if (!type) return;
    
    const systemTypes = ['Компьютер', 'Ноутбук', 'Сервер'];
    const monitorTypes = ['Монитор'];
    const networkTypes = ['Сетевое оборудование', 'IP-телефон'];
    
    if (systemTypes.includes(type) || type === 'Другое') {
        $('.system-fields-edit').show();
    }
    if (monitorTypes.includes(type) || type === 'Другое') {
        $('.monitor-fields-edit').show();
    }
    if (networkTypes.includes(type) || type === 'Другое') {
        $('.network-fields-edit').show();
    }
}
</script>
